services:
  api: 
    build: .
    ports: 
      - ${APP_PORT}:8000
    env_file:
      - .env
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - holiday-vibes
  postgres:
    container_name: postgres
    image: postgres:latest
    restart: always
    env_file:
      - .env
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - holiday-vibes
volumes:
  postgres_data:
    
networks:
  holiday-vibes:  