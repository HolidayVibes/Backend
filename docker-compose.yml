services:
  api:
    build: .
    ports:
      - ${APP_PORT}:8000
    env_file:
      - .env
    networks:
      - holiday-vibes
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    container_name: postgres
    image: postgres:18-alpine
    restart: always
    env_file:
      - .env
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - holiday-vibes
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d holiday-vibes"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  holiday-vibes:
