version: '3.9' 

services:
  postgres:
    container_name: postgres
    image: postgres:latest
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - 5433:5432
    volumes:
      - ./docker/postgres-data:/var/lib/postgresql
    networks:
      - holiday-vibes
volumes:
  postgres_data:

networks:
  holiday-vibes: